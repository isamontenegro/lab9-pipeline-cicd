name: Pipeline CI/CD - LAB9

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

jobs:

  Testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          pytest

  Build_e_Push:
    needs: Testes
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e enviar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            isabellimontenegro/lab9-api:${{ github.ref_name }}
            isabellimontenegro/lab9-api:${{ github.sha }}

  Deploy_Homologacao:
    needs: Build_e_Push
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy em Homologacao
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOMOL_EC2_HOST }}
          username: ${{ secrets.HOMOL_EC2_USERNAME }}
          key: ${{ secrets.HOMOL_EC2_SSH_KEY }}
          script: |
            docker pull isabellimontenegro/lab9-api:develop
            docker stop lab9-homol || true
            docker rm lab9-homol || true
            docker run -d \
              --name lab9-homol \
              -p 8080:8080 \
              --restart always \
              isabellimontenegro/lab9-api:develop

  Deploy_Producao:
    needs: Build_e_Push
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: Deploy em Producao
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull isabellimontenegro/lab9-api:main
            docker stop lab9-producao || true
            docker rm lab9-producao || true
            docker run -d \
              --name lab9-producao \
              -p 8080:8080 \
              --restart always \
              isabellimontenegro/lab9-api:main